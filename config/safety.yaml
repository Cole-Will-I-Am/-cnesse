# Safety + containment policy.
# autonomy: full self-amplification. When auto_merge is true, a change that
# passes the FULL gate (jailed tests + red team + maintainer + objective score)
# AND touches no protected path is merged to main automatically. Governance
# changes are never auto-merged (see protected_paths); they always require a
# human. require_isolation means auto-merge only happens if tests actually ran
# in the systemd-run jail (never on the unisolated fallback).
autonomy:
  auto_merge: true
  merge_method: squash
  require_isolation: true
  repair_loops: 2   # when jailed tests fail, let the coder repair & re-test N times

# External review: Codex (chatgpt-codex-connector) reviews every PR a couple of
# minutes after it opens. Wait briefly for that review before auto-merging; if it
# flags a blocking severity, hold the PR (don't merge) for repair/human. Lower
# severities are merged but harvested into the roadmap for future cycles to fix.
# Timeout fallback ensures the loop never stalls if Codex is slow/absent.
codex_review:
  enabled: true
  wait_sec: 180
  block_severities: [P1]


# Sandbox tiers (capability vs containment):
#   controlled (ACTIVE): the systemd-run jail below — non-root (nobody), no
#     network, fs read-only except the worktree + a private writable /tmp
#     ($ECNYSS_SCRATCH), resource/time capped. SAFELY permits file I/O,
#     local subprocess, and threads — so the lab can build stateful capabilities
#     that act, not just pure functions.
#   networked (FUTURE, human-gated): an allowlisted network namespace + mocked
#     tools. NOT enabled: outbound network for auto-merged, model-written code is
#     a deliberate escalation that must be designed + human-approved, not default.
#
# isolation: how generated code is executed during sandbox testing.
isolation:
  enabled: true
  uid: 65534           # nobody
  gid: 65534           # nogroup
  memory_max: "1G"
  cpu_quota: "90%"
  tasks_max: 256
  runtime_max_sec: 240
  private_network: true   # generated code gets NO network during tests

# Governance-critical files. A cycle that proposes changing any of these is
# NOT auto-approvable — it is recorded as requiring explicit human
# authorization, so the autonomous pipeline can never unlock its own guardrails
# or rewrite its own enforcement/scoring/ledger code and present it as "ready".
protected_paths:
  - config/permissions.yaml
  - config/objectives.yaml
  - config/world.yaml
  - config/safety.yaml
  - ecnyss/kernel/permission_model.py
  - ecnyss/kernel/sandbox.py
  - ecnyss/evolution/merge_gate.py
  - ecnyss/protocol/hash_chain.py
  - ecnyss/protocol/babel_manifest.py
  - ecnyss/protocol/canonical.py
  - bench/    # held-out benchmark — the lab must not see or game it
