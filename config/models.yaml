# Per-agent model registry. Only Ollama CLOUD-backed custom builds.
# prompt_char_budget caps how much context we SEND (protects the window,
# critical for thinking models like Kimi). num_predict/temperature are baked
# into each Modelfile; listed here for visibility and optional override.
agents:
  architect:
    model: ecnyss-architect:latest      # base: kimi-k2.6:cloud (thinking — tightly bounded)
    prompt_char_budget: 24000           # gets the COMPACT map (1 line/module) — scales
    num_predict: 4096
    temperature: 0.4
    timeout_sec: 180
  planner:
    model: ecnyss-planner:latest        # base: nemotron-3-ultra:cloud
    prompt_char_budget: 24000
    num_predict: 4096
    temperature: 0.3
    timeout_sec: 180
  coder:
    model: ecnyss-coder:latest          # base: qwen3.5:397b-cloud
    prompt_char_budget: 48000
    num_predict: 16384
    temperature: 0.15
    timeout_sec: 240
  redteam:
    model: ecnyss-redteam:latest        # base: deepseek-v4-pro:cloud
    prompt_char_budget: 32000
    num_predict: 4096
    temperature: 0.6
    timeout_sec: 180
  maintainer:
    model: ecnyss-maintainer:latest     # base: minimax-m3:cloud
    prompt_char_budget: 20000
    num_predict: 2048
    temperature: 0.2
    timeout_sec: 120

ollama_url: http://127.0.0.1:11434
